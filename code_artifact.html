<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과제 마감 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800">

    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md py-6 px-4 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">과제 마감 관리</h1>
        <p class="text-sm text-indigo-100 mt-1">마감일을 똑똑하게 관리하고 여유롭게 제출하세요!</p>
    </header>

    <main class="flex-grow container mx-auto max-w-xl px-4 py-6">
        <!-- Filter Tabs & Stats -->
        <div class="flex justify-between items-center mb-4 bg-white p-3 rounded-xl shadow-sm">
            <div id="stats-summary" class="text-sm font-medium text-gray-600">
                총 <span id="total-count" class="text-indigo-600 font-bold">0</span>개 | 완료 <span id="done-count" class="text-green-600 font-bold">0</span>개
            </div>
            <div class="flex space-x-1">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-600 transition">전체</button>
                <button onclick="setFilter('active')" id="filter-active" class="px-3 py-1 text-xs font-semibold rounded-lg text-gray-500 hover:bg-gray-100 transition">진행 중</button>
                <button onclick="setFilter('completed')" id="filter-completed" class="px-3 py-1 text-xs font-semibold rounded-lg text-gray-500 hover:bg-gray-100 transition">완료됨</button>
            </div>
        </div>

        <!-- Assignment List Container -->
        <div id="assignment-list" class="space-y-3 pb-24">
            <!-- Dynamic items will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12">
            <svg class="w-16 h-16 mx-auto text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
            </svg>
            <p class="text-gray-500 font-medium">등록된 과제가 없습니다.</p>
            <p class="text-sm text-gray-400 mt-1">아래의 추가 버튼을 눌러 과제를 등록해보세요!</p>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t border-gray-200 p-4 shadow-lg flex justify-center">
        <button onclick="openModal()" class="w-full max-w-xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition duration-200 flex items-center justify-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            <span>과제 추가하기</span>
        </button>
    </div>

    <div id="assignment-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden transform transition-all scale-95 opacity-0 duration-200" id="modal-content">
            <div class="bg-indigo-600 px-6 py-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">새 과제 등록</h3>
                <button onclick="closeModal()" class="text-indigo-200 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <form id="assignment-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">과목명 / 과제 제목</label>
                    <input type="text" id="input-title" required placeholder="예: 알고리즘 과제 3번" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">마감일</label>
                    <input type="datetime-local" id="input-date" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 rounded-xl transition">취소</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">저장</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State Variables
        let assignments = JSON.parse(localStorage.getItem('assignments')) || [];
        let currentFilter = 'all';

        // Initialize App on Load
        window.onload = function() {
            // Set default datetime picker to today + 7 days
            const now = new Date();
            now.setDate(now.getDate() + 7);
            document.getElementById('input-date').value = now.toISOString().slice(0, 16);
            
            renderAssignments();
        };

        // Modal Controls
        function openModal() {
            const modal = document.getElementById('assignment-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('assignment-modal');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('assignment-form').reset();
            }, 200);
        }

        // Form Submit Handler
        function handleFormSubmit(event) {
            event.preventDefault();
            const titleInput = document.getElementById('input-title').value.trim();
            const dateInput = document.getElementById('input-date').value;

            if (!titleInput || !dateInput) return;

            const newAssignment = {
                id: Date.now(),
                title: titleInput,
                deadline: dateInput,
                completed: false
            };

            assignments.push(newAssignment);
            saveAndRender();
            closeModal();
        }

        // Delete Assignment
        function deleteAssignment(id) {
            assignments = assignments.filter(item => item.id !== id);
            saveAndRender();
        }

        // Toggle Completed Status
        function toggleComplete(id) {
            assignments = assignments.map(item => {
                if (item.id === id) {
                    return { ...item, completed: !item.completed };
                }
                return item;
            });
            saveAndRender();
        }

        // Filter Setter
        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'active', 'completed'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-600 transition";
                } else {
                    btn.className = "px-3 py-1 text-xs font-semibold rounded-lg text-gray-500 hover:bg-gray-100 transition";
                }
            });
            renderAssignments();
        }

        // Save to LocalStorage & Refresh View
        function saveAndRender() {
            localStorage.setItem('assignments', JSON.stringify(assignments));
            renderAssignments();
        }

        // Calculate D-Day Remaining Time
        function getRemainingTimeText(deadlineStr) {
            const now = new Date();
            const deadline = new Date(deadlineStr);
            const diffMs = deadline - now;

            const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            const diffHours = Math.ceil(diffMs / (1000 * 60 * 60));

            if (diffMs < 0) {
                return { text: "마감됨", badgeClass: "bg-red-100 text-red-600 border-red-200" };
            } else if (diffDays === 0) {
                return { text: "오늘 마감!", badgeClass: "bg-amber-100 text-amber-700 border-amber-200 animate-pulse" };
            } else if (diffDays === 1) {
                return { text: "내일 마감", badgeClass: "bg-orange-100 text-orange-600 border-orange-200" };
            } else if (diffDays <= 3) {
                return { text: `D-${diffDays}`, badgeClass: "bg-orange-50 text-orange-500 border-orange-100" };
            } else {
                return { text: `D-${diffDays}`, badgeClass: "bg-indigo-50 text-indigo-600 border-indigo-100" };
            }
        }

        // Render Assignment Cards
        function renderAssignments() {
            const listContainer = document.getElementById('assignment-list');
            const emptyState = document.getElementById('empty-state');
            const totalCountEl = document.getElementById('total-count');
            const doneCountEl = document.getElementById('done-count');

            // Filter logic
            let filtered = assignments;
            if (currentFilter === 'active') {
                filtered = assignments.filter(item => !item.completed);
            } else if (currentFilter === 'completed') {
                filtered = assignments.filter(item => item.completed);
            }

            // Sort by deadline ascending
            filtered.sort((a, b) => new Date(a.deadline) - new Date(b.deadline));

            // Update stats
            totalCountEl.textContent = assignments.length;
            doneCountEl.textContent = assignments.filter(i => i.completed).length;

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let htmlContent = '';

            filtered.forEach(item => {
                const { text, badgeClass } = getRemainingTimeText(item.deadline);
                const formattedDate = new Date(item.deadline).toLocaleString('ko-KR', {
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                htmlContent += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between transition hover:shadow-md ${item.completed ? 'opacity-60 bg-gray-50' : ''}">
                        <div class="flex items-center space-x-3 flex-grow min-w-0 pr-2">
                            <button onclick="toggleComplete(${item.id})" class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition flex-shrink-0 ${item.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 hover:border-indigo-500'}">
                                ${item.completed ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </button>
                            <div class="min-w-0">
                                <h4 class="font-semibold text-gray-800 truncate ${item.completed ? 'line-through text-gray-400' : ''}">${escapeHtml(item.title)}</h4>
                                <p class="text-xs text-gray-500 mt-0.5">${formattedDate}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 flex-shrink-0">
                            <span class="px-2.5 py-1 text-xs font-bold rounded-full border ${badgeClass}">${text}</span>
                            <button onclick="deleteAssignment(${item.id})" class="text-gray-400 hover:text-red-500 p-1.5 rounded-lg hover:bg-red-50 transition" title="삭제">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 2 0 00-2-2h-4a1 2 0 00-2 2v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = htmlContent;
        }

        // XSS Prevention helper
        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
